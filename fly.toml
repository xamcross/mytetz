# fly.io configuration for mytetz.
#
# Region note: primary_region is "fra" on purpose — the MongoDB Atlas M0 cluster
# lives in AWS EU_CENTRAL_1 (Frankfurt), so keeping the app in fra keeps the
# database round-trip on the same metro. Moving one without the other adds tens
# of milliseconds to every query. See docs/deploy.md.

app = "mytetz"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MONGODB_DATABASE = "mytetz"

  # Which header the rate limiter keys on. Cloudflare sits in front of this app (see docs/deploy.md),
  # so CF-Connecting-IP is the visitor's real address and gives a bucket per visitor.
  #
  # The trade, recorded because it is a security decision and not a tuning one: anyone reaching
  # mytetz.fly.dev directly, bypassing Cloudflare, can set this header to whatever they like and so
  # escape their own rate limit. That evasion is bounded by the limiter's key ceiling and by the
  # eviction cap in TopicRequestRepository, and it costs honest visitors nothing. The alternative,
  # Fly-Client-IP, cannot be forged but resolves to the Cloudflare edge — so everyone behind one
  # edge would share a single allowance and legitimate visitors would be refused.
  #
  # Fly-Client-IP is the CODE default, so an unconfigured deployment still gets an unforgeable key.
  # Set this to "none" only for a deployment behind no proxy it controls.
  MYTETZ_CLIENT_IP_HEADER = "CF-Connecting-IP"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine stays up. It does not scale to zero, and that is deliberate.
  #
  # Scale to zero held this app down for about 24 hours from 2026-08-16. The failure is a loop:
  #   1. A bot scan for /wp-includes/ paths wakes the machine about every 38 seconds.
  #   2. The JVM needs several minutes on a throttled shared-cpu-1x to bind port 8080.
  #   3. The proxy serves no traffic in that time, calls the machine idle, and stops it mid-boot.
  #   4. The next scan repeats the cycle. The app never binds, so every request gets a 503.
  #
  # The machine ran 96% of the time in that state, so scale to zero also saved almost nothing:
  # fly bills a started machine by the clock and not by its load.
  #
  # "off" stops the proxy from ever stopping the machine, which breaks the loop at step 3.
  # min_machines_running is inert while auto_stop_machines is "off". It is 1 so that a later
  # change back to "stop" keeps one machine up rather than none.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
