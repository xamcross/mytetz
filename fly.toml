# fly.io configuration for mytetz.
#
# Region note: primary_region is "fra" on purpose — the MongoDB Atlas M0 cluster
# lives in AWS EU_CENTRAL_1 (Frankfurt), so keeping the app in fra keeps the
# database round-trip on the same metro. Moving one without the other adds tens
# of milliseconds to every query. See docs/deploy.md.

app = "mytetz"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MONGODB_DATABASE = "mytetz"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle; the proxy restarts the machine on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
