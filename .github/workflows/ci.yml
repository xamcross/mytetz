name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # :backend:api:processResources builds the Angular bundle into the jar, so the backend
      # job needs a pinned Node too rather than whatever the runner image happens to ship.
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      # Formatting is checked before the tests, because it is the fastest step and its failure is
      # the cheapest to fix. The scope is `src` and `e2e`: those hold the code, and a reformat of
      # `selection.ts` is what could break the selection invariant. The repository's JSON config
      # and README are outside the scope on purpose. Reformatting them is noise, and it would put
      # an unrelated diff in front of every reviewer.
      #
      # Run `npm run format` to fix a failure here.
      - run: npm run format:check
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: true
